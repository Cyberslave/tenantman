<div class="toolbar" role="toolbar" aria-label="Formatting">
  <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
  <span class="sep"></span>
  <button type="button" data-cmd="h1" title="Heading 1">H1</button>
  <button type="button" data-cmd="h2" title="Heading 2">H2</button>
  <button type="button" data-cmd="p" title="Normal text">Text</button>
  <button type="button" data-cmd="quote" title="Quote">Quote</button>
  <span class="sep"></span>
  <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
  <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
  <span class="sep"></span>
  <button type="button" data-cmd="left" title="Align left">Left</button>
  <button type="button" data-cmd="center" title="Centre">Centre</button>
  <button type="button" data-cmd="right" title="Align right">Right</button>
  <span class="sep"></span>
  <button type="button" data-cmd="link" title="Insert link">Link</button>
  <button type="button" data-cmd="table" title="Insert table">Table</button>
  <button type="button" data-cmd="insertHorizontalRule" title="Divider line">Line</button>
  <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
  <span class="sep"></span>
  <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)">Redo</button>
  <span class="small muted words" id="words"></span>
</div>
